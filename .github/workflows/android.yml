name: Android APK Build with Xray

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout official libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: 93af542c72ffad0d9c9c7b9a6975eb6d2a5f2d92
          path: libXray

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Build libXray AAR
        run: |
          python3 libXray/build/main.py android
          mkdir -p app/libs
          cp libXray/libXray.aar app/libs/libXray.aar

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NART-CONFIG-BUILDER-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Xray library
        uses: actions/upload-artifact@v4
        with:
          name: NART-LIBXRAY-AAR
          path: app/libs/libXray.aar
