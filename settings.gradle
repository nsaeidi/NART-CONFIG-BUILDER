pluginManagement {
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven {
            url = uri("https://projects.exoplatform.org/content/repositories/public/")
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.android.application") {
                useModule("com.android.tools.build:gradle:${requested.version}")
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven {
            url = uri("https://projects.exoplatform.org/content/repositories/public/")
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "NART-CONFIG-BUILDER"
include(":app")
